name: Fleet

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: fleet
  cancel-in-progress: false

jobs:
  save:
    if: github.event.issue.title == 'marine-fleet-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Write fleet
        id: apply
        env:
          ACTOR: ${{ github.actor }}
        run: python3 -m app.fleet_file
      - name: Commit fleet
        if: steps.apply.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -- static/fleet.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="gaszapros" -c user.email="354618419+gaszapros@users.noreply.github.com" commit -m "Update vessel camera links."
          git push
          gh workflow run Pages --ref main
      - name: Close the sync issue
        if: always() && steps.apply.outputs.status != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close ${{ github.event.issue.number }} --comment "$(cat fleet-note.txt)"
